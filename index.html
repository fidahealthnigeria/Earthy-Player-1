<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Earthy — Silent Grounding & Micro-Breaks</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html { width: 100%; height: 100%; background: #0c0f0a; overflow: hidden; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

/* Video container handling dual elements for seamless crossfading */
.video-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 2s ease-in-out; }
video.active { opacity: 1; z-index: 2; }

/* Minimalist UI Controls Overlay */
.controls { position: fixed; bottom: 40px; right: 40px; z-index: 10; display: flex; align-items: center; gap: 14px; opacity: 0.4; transition: opacity 0.3s ease; }
.controls:hover { opacity: 1; }

button { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; letter-spacing: 0.5px; transition: background 0.2s, transform 0.2s; }
button:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.03); }
button:active { transform: scale(0.98); }

.status { font-size: 12px; color: rgba(255, 255, 255, 0.6); letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="video-container">
<video id="vid1" autoplay muted playsinline></video>
<video id="vid2" autoplay muted playsinline></video>
</div>

<div class="controls">
<span id="counter" class="status">Loading...</span>
<button onclick="nextClip()">Skip</button>
</div>

<script>
// Configuration
let clipDuration = 15; // Target duration in seconds per clip before auto-advancing
let playlist = [];
let currentIndex = 0;
let timer = null;

const vid1 = document.getElementById('vid1');
const vid2 = document.getElementById('vid2');
let activeVideo = vid1;
let inactiveVideo = vid2;

// Load playlist from JSON
async function initPlayer() {
try {
const response = await fetch('videos.json');
playlist = await response.json();

if (!playlist || playlist.length === 0) {
document.getElementById('counter').innerText = "No videos found";
return;
}

// Shuffle playlist slightly or start from index 0
playClip(currentIndex);
} catch (err) {
console.error('Error loading videos.json:', err);
document.getElementById('counter').innerText = "Failed to load playlist";
}
}

function playClip(index) {
if (playlist.length === 0) return;

// Update counter UI
document.getElementById('counter').innerText = `${index + 1} / ${playlist.length}`;

// Set source on the inactive video element
inactiveVideo.src = playlist[index];
inactiveVideo.load();

inactiveVideo.oncanplaythrough = () => {
inactiveVideo.play().then(() => {
// Perform crossfade
inactiveVideo.classList.add('active');
activeVideo.classList.remove('active');

// Swap references
let temp = activeVideo;
activeVideo = inactiveVideo;
inactiveVideo = temp;

// Clear old timer and set new auto-advance timer
clearTimeout(timer);
timer = setTimeout(nextClip, clipDuration * 1000);
}).catch(e => console.log("Playback prevented:", e));
};
}

function nextClip() {
if (playlist.length === 0) return;
currentIndex = (currentIndex + 1) % playlist.length;
playClip(currentIndex);
}

// Start on page load
window.onload = initPlayer;
</script>
</body>
</html>
