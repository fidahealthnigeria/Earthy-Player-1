<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Earthy — YouTube Ambient Player</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html { width: 100%; height: 100%; background: #0c0f0a; overflow: hidden; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

/* Fill the screen with the YouTube player and disable clicks so it acts like a background */
#player-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; }
#youtube-player { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; transform: translate(-50%, -50%); pointer-events: none; }

/* Solid high-contrast control panel guaranteed to be visible over any bright, white, or dark video */
.controls { 
  position: fixed; 
  bottom: 40px; 
  right: 40px; 
  z-index: 10; 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  background: rgba(15, 15, 15, 0.92);
  padding: 10px 16px;
  border-radius: 40px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  opacity: 0.6; 
  transition: opacity 0.3s ease; 
}
.controls:hover { opacity: 1; }

button { 
  background: rgba(255, 255, 255, 0.12); 
  border: 1px solid rgba(255, 255, 255, 0.2); 
  color: #fff; 
  padding: 8px 16px; 
  border-radius: 24px; 
  cursor: pointer; 
  font-size: 13px; 
  font-weight: 500;
  letter-spacing: 0.5px; 
  transition: background 0.2s, transform 0.2s, border-color 0.2s; 
}
button:hover { background: rgba(255, 255, 255, 0.25); border-color: rgba(255, 255, 255, 0.5); transform: scale(1.03); }
button:active { transform: scale(0.98); }

.status { 
  font-size: 11px; 
  color: rgba(255, 255, 255, 0.8); 
  letter-spacing: 1px; 
  text-transform: uppercase; 
  padding: 0 6px;
}
</style>
</head>
<body>

<div id="player-container">
  <div id="youtube-player"></div>
</div>

<div class="controls">
  <span id="counter" class="status">Loading...</span>
  <button id="mute-btn" onclick="toggleSound()">Unmute Audio (M)</button>
  <button onclick="nextClip()">Skip (Space)</button>
</div>

<!-- Load YouTube IFrame Player API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let clipDuration = 15; // Time in seconds per clip before auto-advancing
let playlist = [];
let currentIndex = 0;
let player;
let timer = null;
let isMuted = true;

// Shuffle playlist array on load for fresh ambient playback
function shufflePlaylist(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// Automatically called by the YouTube API script when it finishes loading
function onYouTubeIframeAPIReady() {
  fetch('./videos.json')
    .then(res => {
      if (!res.ok) throw new Error("HTTP error " + res.status);
      return res.json();
    })
    .then(data => {
      if (!data || data.length === 0) {
        document.getElementById('counter').innerText = "No videos found";
        return;
      }
      
      playlist = shufflePlaylist(data);
      
      player = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: playlist[currentIndex],
        playerVars: {
          'autoplay': 1,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'iv_load_policy': 3,
          'loop': 1,
          'modestbranding': 1,
          'playsinline': 1,
          'rel': 0,
          'autohide': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    })
    .catch(err => {
      console.error('Error loading videos.json:', err);
      document.getElementById('counter').innerText = "Failed to load playlist";
    });
}

function onPlayerReady(event) {
  event.target.mute(); // Mute initially for ambient background playback
  isMuted = true;
  document.getElementById('mute-btn').innerText = "Unmute Audio (M)";
  event.target.playVideo();
  updateUI();
  resetTimer();
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    nextClip();
  }
}

function toggleSound() {
  if (!player) return;
  const muteBtn = document.getElementById('mute-btn');
  
  // Correct method name: unMute() with a capital 'M'
  if (player.isMuted()) {
    player.unMute();
    player.setVolume(50);
    muteBtn.innerText = "Mute Audio (M)";
    isMuted = false;
  } else {
    player.mute();
    muteBtn.innerText = "Unmute Audio (M)";
    isMuted = true;
  }
}

function playClip(index) {
  if (!player || playlist.length === 0) return;
  currentIndex = index;
  player.loadVideoById(playlist[currentIndex]);
  
  // Enforce sound preference after loading the new video snippet
  setTimeout(() => {
    if (isMuted) {
      player.mute();
    } else {
      player.unMute();
      player.setVolume(50);
    }
  }, 300);
  
  updateUI();
  resetTimer();
}

function nextClip() {
  if (playlist.length === 0) return;
  currentIndex = (currentIndex + 1) % playlist.length;
  playClip(currentIndex);
}

function resetTimer() {
  clearTimeout(timer);
  timer = setTimeout(nextClip, clipDuration * 1000);
}

function updateUI() {
  document.getElementById('counter').innerText = `${currentIndex + 1} / ${playlist.length}`;
}

// Keyboard Shortcuts Listener
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault(); 
    nextClip();
  }
  if (e.code === 'KeyM') {
    toggleSound();
  }
});
</script>
</body>
</html>
