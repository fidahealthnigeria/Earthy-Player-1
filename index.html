<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earthy Grounding — Silent Meditative Player</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body, html {

            width: 100%;

            height: 100%;

            background-color: #0b0f0d;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            overflow: hidden;

            color: #f1f5f3;

        }



        .player-container {

            position: relative;

            width: 100vw;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000;

        }



        /* Two video elements stacked for crossfading */

        video {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition: opacity 1.5s ease-in-out;

            opacity: 0;

        }



        video.active {

            opacity: 1;

        }



        /* Minimal UI Overlay that fades out when idle */

        .ui-overlay {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            padding: 2rem;

            z-index: 10;

            pointer-events: none;

            transition: opacity 0.5s ease;

        }



        .ui-overlay.hidden {

            opacity: 0;

        }



        /* Top Bar */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            pointer-events: auto;

        }



        .title-display {

            font-size: 0.95rem;

            letter-spacing: 0.1em;

            text-transform: uppercase;

            color: rgba(241, 245, 243, 0.7);

            font-weight: 300;

            background: rgba(0, 0, 0, 0.4);

            padding: 0.4rem 0.8rem;

            border-radius: 4px;

            backdrop-filter: blur(4px);

        }



        /* Bottom Controls */

        .bottom-bar {

            display: flex;

            flex-direction: column;

            gap: 1rem;

            pointer-events: auto;

            max-width: 400px;

            margin: 0 auto;

            width: 100%;

        }



        .progress-track {

            width: 100%;

            height: 3px;

            background: rgba(255, 255, 255, 0.2);

            border-radius: 2px;

            overflow: hidden;

        }



        .progress-fill {

            width: 0%;

            height: 100%;

            background: rgba(241, 245, 243, 0.8);

            transition: width 0.1s linear;

        }



        .controls-row {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 1rem;

        }



        button {

            background: rgba(255, 255, 255, 0.1);

            border: 1px solid rgba(255, 255, 255, 0.2);

            color: #f1f5f3;

            padding: 0.6rem 1.4rem;

            border-radius: 30px;

            font-size: 0.85rem;

            letter-spacing: 0.05em;

            cursor: pointer;

            backdrop-filter: blur(4px);

            transition: all 0.2s ease;

        }



        button:hover {

            background: rgba(255, 255, 255, 0.25);

            border-color: rgba(255, 255, 255, 0.4);

        }



        /* Helper message for full screen */

        .hint {

            position: absolute;

            bottom: 1.5rem;

            right: 2rem;

            font-size: 0.75rem;

            color: rgba(255, 255, 255, 0.4);

            pointer-events: none;

        }

    </style>

</head>

<body>



    <div class="player-container">

        <!-- Dual video elements for seamless crossfading -->

        <video id="videoA" muted playsinline></video>

        <video id="videoB" muted playsinline></video>



        <!-- UI Overlays -->

        <div class="ui-overlay" id="uiOverlay">

            <div class="top-bar">

                <div class="title-display" id="titleDisplay">Loading...</div>

                <button id="fullscreenBtn">Fullscreen</button>

            </div>



            <div class="bottom-bar">

                <div class="progress-track">

                    <div class="progress-fill" id="progressFill"></div>

                </div>

                <div class="controls-row">

                    <button id="skipBtn">Skip to Next &rarr;</button>

                </div>

            </div>

        </div>



        <div class="hint">Move mouse to show controls</div>

    </div>



    <script>

        // 1. Your Earthy Video Playlist

        // Replace these URLs with your actual MP4 video files or local paths

        const playlist = [

            {

                title: "Forest Moss Micro-Zoom",

                url: "...mp4"

            },

            {

                title: "River Stones & Flow",

                url: "..mp4"

            },

            {

                title: "Rough Tree Bark Texture",

                url: "...mp4"

            }

        ];



        let currentIndex = 0;

        let activeVideoSlot = 'A'; // Tracks which video element is currently live

        let clipDuration = 15;      // Automated pass timer in seconds per clip

        let timerStart = Date.now();

        let idleTimer = null;



        const videoA = document.getElementById('videoA');

        const videoB = document.getElementById('videoB');

        const titleDisplay = document.getElementById('titleDisplay');

        const progressFill = document.getElementById('progressFill');

        const skipBtn = document.getElementById('skipBtn');

        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const uiOverlay = document.getElementById('uiOverlay');



        // Initialize player

        function initPlayer() {

            loadVideo(currentIndex);

            startTimerLoop();

        }



        function loadVideo(index) {

            const currentItem = playlist[index];

            titleDisplay.textContent = `${index + 1} / ${playlist.length}: ${currentItem.title}`;



            const incomingVideo = activeVideoSlot === 'A' ? videoB : videoA;

            const outgoingVideo = activeVideoSlot === 'A' ? videoA : videoB;



            incomingVideo.src = currentItem.url;

            incomingVideo.load();

            

            incomingVideo.oncanplaythrough = () => {

                incomingVideo.play().catch(err => console.log("Autoplay prevented:", err));

                

                // Perform Crossfade

                incomingVideo.classList.add('active');

                outgoingVideo.classList.remove('active');



                // Swap active slot

                activeVideoSlot = activeVideoSlot === 'A' ? 'B' : 'A';

                timerStart = Date.now();

            };

        }



        function nextVideo() {

            currentIndex = (currentIndex + 1) % playlist.length;

            loadVideo(currentIndex);

        }



        // 2. Automated Timer & Progress Update

        function startTimerLoop() {

            setInterval(() => {

                const elapsed = (Date.now() - timerStart) / 1000;

                const progressPercent = Math.min((elapsed / clipDuration) * 100, 100);

                progressFill.style.width = `${progressPercent}%`;



                // Auto-advance when clip duration is reached

                if (elapsed >= clipDuration) {

                    nextVideo();

                }

            }, 100);

        }



        // 3. Event Listeners

        skipBtn.addEventListener('click', nextVideo);



        fullscreenBtn.addEventListener('click', () => {

            if (!document.fullscreenElement) {

                document.documentElement.requestFullscreen();

                fullscreenBtn.textContent = "Exit Fullscreen";

            } else {

                document.exitFullscreen();

                fullscreenBtn.textContent = "Fullscreen";

            }

        });



        // Auto-hide UI controls when mouse is inactive for 3 seconds

        document.addEventListener('mousemove', () => {

            uiOverlay.classList.remove('hidden');

            clearTimeout(idleTimer);

            idleTimer = setTimeout(() => {

                uiOverlay.classList.add('hidden');

            }, 3000);

        });



        // Start on load

        window.onload = initPlayer;

    </script>

</body>

</html>
